apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: staging

patchesStrategicMerge:
- ../dev/deployment-patch.yaml

configMapGenerator:
- name: app-config
  literals:
  - environment=staging
  - log-level=info

secretGenerator:
- name: app-secrets
  literals:
  - db-host=staging-postgres.rds.amazonaws.com
  - db-user=appuser
  - db-password=stagingPassword123!
  - db-name=appdb

images:
- name: jenkins-cloud-native-app
  newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/jenkins-cloud-native-app
  newTag: latest