apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: production

configMapGenerator:
- name: app-config
  literals:
  - environment=production
  - log-level=warn

secretGenerator:
- name: app-secrets
  literals:
  - db-host=production-postgres.rds.amazonaws.com
  - db-user=appuser
  - db-password=productionPassword123!
  - db-name=appdb

images:
- name: jenkins-cloud-native-app
  newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/jenkins-cloud-native-app
  newTag: latest