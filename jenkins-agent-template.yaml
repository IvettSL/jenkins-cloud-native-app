apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-agent-template
  namespace: jenkins
data:
  docker-agent.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      containers:
      - name: jnlp
        image: jenkins-agent-docker:latest
        args:
        - "$(computer.jnlpmac)"
        - "$(computer.name)"
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
