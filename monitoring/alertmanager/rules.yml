groups:
- name: app-alerts
  rules:
  - alert: HighErrorRate
    expr: sum(rate(app_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(app_http_requests_total[5m])) * 100 > 5
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"
      description: "Error rate is {{ $value }}% for the last 5 minutes"

  - alert: HighResponseTime
    expr: avg(rate(app_response_time_seconds_sum[5m])) / avg(rate(app_response_time_seconds_count[5m])) > 0.5
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: "High response time detected"
      description: "Response time is {{ $value }}s for the last 3 minutes"

  - alert: HighCPUUsage
    expr: avg(rate(container_cpu_usage_seconds_total[5m])) * 100 > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage"
      description: "CPU usage is {{ $value }}% for the last 5 minutes"

  - alert: HighMemoryUsage
    expr: avg(container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage"
      description: "Memory usage is {{ $value }}% for the last 5 minutes"

  - alert: PodNotReady
    expr: kube_pod_status_ready{condition="false"} > 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Pod not ready"
      description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for 5 minutes"

  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service is down"
      description: "Service {{ $labels.job }} is down for more than 1 minute"